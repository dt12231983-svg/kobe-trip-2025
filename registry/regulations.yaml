# ───────── 検出済みの不整合 ─────────

issues:
  version_ambiguity:
    - compliance-kanri     # 2版併存、廃止条項未確認
    - seibi-kanri          # 20260601版 と TRC版
    - harassment-evgm      # HD版との層をまたぐ併存
    - shugyo-kisoku        # 原本ファイルの所在が未特定

  duplicate_placement:
    - regulation: chingin
      locations: ["REG_ROOT_PERSONAL/【閲覧用】規程・就業規則/", "HR_ROOT/人事制度/"]
    - note: |
        REG_ROOT（share@）と REG_ROOT_PERSONAL（takizawa-d@）に同名ファイルが多数存在する。
        個人領域が正本のコピーなのか、独自に更新されているのかの確認が必要。

  naming_inconsistency:
    patterns_found:
      - "（2024.9.1）"        # 全角括弧＋ドット区切り
      - "_20260401施行"       # アンダースコア＋施行
      - "　20260401制定"      # 全角スペース＋制定
      - "(20260401改定)"      # 半角括弧＋改定
      - "(20260508改訂)"      # 改定/改訂の混在
      - "（20260601）"        # 日付のみ
    trailing_space:
      - "役員規程（2022.6.7） .docx"
      - "売掛規程（2024.7.1 ）.docx"
    recommendation: "新規作成分は <規程名>_<施行日YYYYMMDD><制定|改定>.docx に統一する（CLAUDE.md 第7節）"

  orphan_files:
    - name: "~$規程（2022.6.7） .docx"
      root: REG_ROOT
      note: "Word ロックファイルの残留。削除候補（削除は人間が判断）。"

  terminology:
    - note: |
        「規程」と「規定」の表記ゆれが文書名・本文の双方にある。
        例：整備管理規程のPDFタイトルが「整備管理規定」、取締役会規程の本文が「この規定は」。
        人事評価規定は固有名詞として「規定」で定着。

  missing_regulations:
    note: "他社で一般的にあるが EVGM に見当たらない規程。制定の要否は要検討。"
    candidates:
      - 規程管理規程（規程の制定・改廃手続きそのものを定める規程）
      - 文書管理規程
      - 情報セキュリティ規程 / 個人情報保護規程
      - 印章管理規程
      - 与信管理規程
